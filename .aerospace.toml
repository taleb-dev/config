# AeroSpace config — ~/.aerospace.toml
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Reload after editing:  aerospace reload-config

# Run at AeroSpace startup. Uncomment to auto-start things.
# after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalization — keep the tree tidy automatically
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout orientation logic: wide screens tile horizontally first
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Don't focus a window just because the mouse hovers it
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Mouse follows focus when changing focus across monitors / windows
# on-focus-changed = ['move-mouse window-lazy']

[key-mapping]
preset = 'qwerty'

# Gaps between windows and screen edges
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ── Main mode: everyday bindings (alt = Option key) ──────────────────
[mode.main.binding]

# Launch terminal (uses default macOS terminal app; change as you like)
alt-enter = '''exec-and-forget osascript -e 'tell application "Terminal" to do script ""\
' -e 'tell application "Terminal" to activate' '''

# Open iTerm2
alt-shift-t = 'exec-and-forget open -a iTerm'

# Layout controls
alt-slash = 'layout tiles horizontal vertical'   # toggle tiling orientation
alt-comma = 'layout accordion horizontal vertical' # toggle accordion

# Focus windows
alt-shift-h = 'focus left'
alt-shift-j = 'focus down'
alt-shift-k = 'focus up'
alt-shift-l = 'focus right'

# Resize focused window
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Switch to workspace (4 total)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

# Move focused window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'

# Jump back to the previously focused workspace
alt-tab = 'workspace-back-and-forth'
# Move whole workspace to the other monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Toggle floating / tiling for the focused window
alt-shift-f = 'layout floating tiling'

# Maximize (fullscreen) the focused window
alt-shift-m = 'fullscreen'

# Fullscreen the focused window (within its tile)
alt-f = 'fullscreen'

# Enter service mode for less-common actions
alt-shift-semicolon = 'mode service'

# ── Service mode: reset / config / join ──────────────────────────────
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset window tree
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join focused window with neighbor
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ── Auto-assign apps to workspaces (uncomment & adjust bundle IDs) ────
# Find an app's bundle id:  osascript -e 'id of app "Safari"'
# [[on-window-detected]]
# if.app-id = 'com.apple.Safari'
# run = 'move-node-to-workspace 2'
#
# [[on-window-detected]]
# if.app-id = 'com.googlecode.iterm2'
# run = 'move-node-to-workspace 1'